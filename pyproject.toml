[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-pipeline"
version = "0.6.0.dev0"
description = "LLM-first conversational ETL pipeline generator"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Osiris Project", email = "petr@keboola.com"},
]
keywords = [
    "etl", "elt", "pipeline", "oml", "duckdb", "sql", "llm", "ai",
    "conversational", "data engineering", "human-in-the-loop",
    "mysql", "supabase", "postgres", "csv",
    "openai", "claude", "gemini", "sql safety"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0.2",
    "duckdb>=0.9.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    # 2.x, not 1.2.1. `osiris/relay/server.py` calls
    # `Server(instructions=, on_list_tools=, on_call_tool=)`, which is the mcp 2.x
    # constructor; mcp 1.2.1's is `Server(name, version=None)` and `osiris serve`
    # dies on a legal resolution of the old floor with
    # `TypeError: unexpected keyword argument 'instructions'`. A floor that the
    # code cannot run against is not a floor, it is a lie about what was tested.
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    # Imported directly by tests/relay/test_server.py, which drives the stdio
    # server through anyio task groups. It arrives transitively via httpx and
    # mcp, but a transitive dependency is not a contract: either of those may
    # drop it and the suite would stop collecting for a reason no manifest
    # explains.
    "anyio>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.4.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/keboola/osiris"
Documentation = "https://github.com/keboola/osiris/tree/main/docs"
Repository = "https://github.com/keboola/osiris"
Issues = "https://github.com/keboola/osiris/issues"
Changelog = "https://github.com/keboola/osiris/blob/main/CHANGELOG.md"

[project.scripts]
osiris = "osiris.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["osiris*"]
exclude = ["tests*", "testing_env*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# Testing configuration lives in pytest.ini, which wins outright: pytest reads
# only the first config file it finds, so a [tool.pytest.ini_options] block here
# would be silently ignored. There was one, and it had drifted — it declared
# markers for deleted subsystems and an asyncio_mode nothing honoured. Config
# that cannot take effect is worse than no config, because it reads as truth.

# Code formatting with Black
[tool.black]
line-length = 120
target-version = ["py311"]

# Import sorting with isort (compatible with Black)
[tool.isort]
profile = "black"
line_length = 120
force_sort_within_sections = true
known_first_party = ["osiris"]

# Type checking with mypy
[tool.mypy]
# Must track requires-python (>=3.11). At "3.9" mypy rejected the 3.10+ syntax
# the codebase actually uses (`X | Y`, `list[str]`).
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "testing_env/",
    "build/",
    "dist/",
]

# Linting with Ruff
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "PL", "W"]
# Optional pragmatics to reduce friction in complex code paths
# Note: "I" (import sorting) disabled - using isort instead to avoid conflicts
extend-ignore = ["E203", "E501", "SIM102", "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR2004", "ARG002", "TRY003", "EM102", "SIM108", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG002", "ARG001", "PLC0415", "PLR0915", "SIM117", "E402", "PLW2901", "F841", "F821", "SIM105"]

[tool.coverage.run]
source = ["osiris"]
omit = [
    "*/tests/*",
    "*/testing_env/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Security scanning with Bandit
[tool.bandit]
exclude_dirs = ["tests", "testing_env", ".venv", "build", "dist"]
skips = ["B101", "B601", "B112", "B311"]  # Skip assert_used, shell injection, try-except-continue, pseudo-random
severity = "medium"

[tool.bandit.assert_used]
skips = ["**/tests/**", "**/test_*.py"]
