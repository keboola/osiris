[pytest]
# The only live pytest config. [tool.pytest.ini_options] in pyproject.toml is
# silently ignored while this file exists.
#
# --strict-markers is on, so every marker used anywhere must appear here.
# Markers for subsystems that no longer exist were removed with them: keeping a
# marker alive after its code is gone invites a test to be filtered out of CI by
# a selector nobody remembers writing.
markers =
    live: requires a running cf-ng instance (opt-in via OSIRIS_TEST_CFNG_URL)
    slow: long-running tests
    cli: CLI contract tests
    unit: pure unit tests with no I/O
    integration: cross-module integration tests
    smoke: quick smoke tests for CI validation
    timeout: enforce per-test execution time limits in CI

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -ra

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
